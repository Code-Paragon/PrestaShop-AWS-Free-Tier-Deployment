- name: Configure DB Server
  hosts: db
  become: yes
  vars_files:
    - group_vars/db.yml

  tasks:
    - name: Install MySQL Server
      apt:
        name: mysql-server
        state: present
        update_cache: yes

    - name: Configure MySQL to allow connections from web server
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'

    - name: Restart MySQL
      service:
        name: mysql
        state: restarted

    - name: Ensure PyMySQL is installed
      apt:
        name: python3-pymysql
        state: present
        update_cache: yes

    - name: Create MySQL admin user with password auth
      community.mysql.mysql_user:
        name: "{{ mysql_login_user }}"
        password: "{{ mysql_login_password }}"
        priv: "*.*:ALL,GRANT"
        host: "localhost"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create prestashop database
      community.mysql.mysql_db:
        name: prestashop
        state: present
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ mysql_login_password }}"

    - name: Create DB user for PrestaShop
      community.mysql.mysql_user:
        name: prestashop
        password: "{{ prestashop_db_password }}"
        priv: 'prestashop.*:ALL'
        host: '%'
        state: present
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ mysql_login_password }}"

# ----------------------------------------------------------
# Web Server Setup (Assuming you already have this working)
# ----------------------------------------------------------

- name: Configure Web Server (PrestaShop 8.1.5 Clean Install)
  hosts: web
  become: yes
  vars_files:
    - group_vars/db.yml

  tasks:
    - name: Install Apache, PHP, and required extensions
      apt:
        name:
          - apache2
          - php
          - php-mysql
          - libapache2-mod-php
          - unzip
          - wget
          - curl
          - git
          - php-cli
          - php-mbstring
          - php-xml
          - php-intl
          - php-curl
          - php-zip
          - php-gd
          - libicu-dev
        state: present
        update_cache: yes

    - name: Enable Apache mod_rewrite
      command: a2enmod rewrite
      notify: Restart Apache

    - name: Remove old site content completely
      file:
        path: /var/www/html/
        state: absent

    - name: Recreate /var/www/html directory
      file:
        path: /var/www/html/
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Download PrestaShop ready-to-install zip
      get_url:
        url: https://github.com/PrestaShop/PrestaShop/releases/download/8.1.5/prestashop_8.1.5.zip
        dest: /tmp/prestashop.zip

    - name: Unpack PrestaShop
      unarchive:
        src: /tmp/prestashop.zip
        dest: /var/www/html/
        remote_src: yes

    - name: Move extracted PrestaShop files to /var/www/html
      shell: |
        shopt -s dotglob
        mv /var/www/html/prestashop/* /var/www/html/
        rm -rf /var/www/html/prestashop
      args:
        executable: /bin/bash

    - name: Set correct permissions
      file:
        path: /var/www/html/
        state: directory
        recurse: yes
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Wait for user to finish PrestaShop setup (5 minutes)
      pause:
        minutes: 5
        prompt: "Pause to allow browser setup of PrestaShop 8.1.5. You can Ctrl+C if done early."

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
